<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meus Veículos | Aluga Fácil</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7f9;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.topo {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.topo h2 {
    margin-top: 0;
}

.btn {
    display: inline-block;
    padding: 11px 16px;
    border-radius: 8px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    margin-right: 8px;
}

.btn-principal {
    background: #111827;
    color: white;
}

.btn-voltar {
    background: #e5e7eb;
    color: #111827;
}

.veiculo {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.status {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    background: #fff3cd;
    color: #856404;
    margin-bottom: 12px;
}

.info {
    margin: 8px 0;
}

.vazio {
    background: white;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
}

.erro {
    background: #f8d7da;
    color: #842029;
    padding: 15px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
    <h1>Aluga Fácil Veículos</h1>
</header>

<div class="container">

    <div class="topo">

        <h2>🚗 Meus veículos</h2>

        <p id="usuario-logado">Carregando...</p>

        <a href="cadastrar-veiculo.html" class="btn btn-principal">
            ➕ Cadastrar veículo
        </a>

        <a href="proprietario.html" class="btn btn-voltar">
            ← Voltar ao painel
        </a>

    </div>

    <div id="lista-veiculos">
        <p>Carregando veículos...</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://clgwzlljyauqezdogeiq.supabase.co";

/*
Cole aqui a MESMA chave que já está funcionando
no seu proprietario.html.
*/

const SUPABASE_KEY = "sb_publishable_g_BCrMrWOq9sEt9LLJIyeA_YeNv4YDA";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function carregarVeiculos() {

    const usuarioLogado =
        document.getElementById("usuario-logado");

    const lista =
        document.getElementById("lista-veiculos");

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

        usuarioLogado.textContent =
            "Você precisa estar logado para acessar seus veículos.";

        lista.innerHTML = `
            <div class="erro">
                Faça login para visualizar seus veículos.
            </div>
        `;

        return;
    }

    usuarioLogado.textContent =
        "Usuário logado: " + user.email;

    const { data: veiculos, error: erroVeiculos } =
        await supabaseClient
            .from("veiculos")
            .select("*")
            .eq("proprietario_id", user.id)
            .order("created_at", { ascending: false });

    if (erroVeiculos) {

        console.error(erroVeiculos);

        lista.innerHTML = `
            <div class="erro">
                Não foi possível carregar seus veículos.
            </div>
        `;

        return;
    }

    if (!veiculos || veiculos.length === 0) {

        lista.innerHTML = `
            <div class="vazio">
                <h3>🚗 Você ainda não possui veículos cadastrados.</h3>
                <p>Cadastre seu primeiro veículo para começar a receber interessados.</p>

                <a href="cadastrar-veiculo.html"
                   class="btn btn-principal">
                    ➕ Cadastrar meu primeiro veículo
                </a>
            </div>
        `;

        return;
    }

    lista.innerHTML = veiculos.map(veiculo => `

        <div class="veiculo">

            <span class="status">
                ${veiculo.status || "analise"}
            </span>

            <h2>
                🚗 ${veiculo.marca || ""}
                ${veiculo.modelo || ""}
                ${veiculo.versao || ""}
            </h2>

            <div class="info">
                <strong>Ano:</strong>
                ${veiculo.ano || "Não informado"}
            </div>

            <div class="info">
                <strong>📍 Cidade:</strong>
                ${veiculo.cidade || "Não informada"}
            </div>

            <div class="info">
                <strong>💰 Diária:</strong>
                R$ ${veiculo.preco_diaria || "Não informado"}
            </div>

            <div class="info">
                <strong>📅 Semanal:</strong>
                R$ ${veiculo.preco_semanal || "Não informado"}
            </div>

            <div class="info">
                <strong>📅 Mensal:</strong>
                R$ ${veiculo.preco_mensal || "Não informado"}
            </div>
            <div style="margin-top:20px;">

<a
    href="editar-veiculo.html?id=${veiculo.id}"
    class="btn btn-principal">
    ✏️ Editar veículo
</a>

</div>
        </div>

    `).join("");

}

carregarVeiculos();

</script>

</body>
</html>
